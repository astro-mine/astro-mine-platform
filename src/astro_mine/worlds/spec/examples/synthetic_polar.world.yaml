# WorldSpec — a small synthetic lunar south-polar world.
#
# The copyable example (G2.11 / UC-C5). Worlds has always been able to read a WorldSpec from YAML
# and had no YAML to read: the only real spec was authored in Python inside the anchor build
# script, so there was nothing to start from and nothing to check what you wrote against.
#
#   astro-mine validate <path>              # or `astro-mine worlds validate <path>`
#   astro-mine new world my.world.yaml      # scaffold one of these
#
# This is deliberately NOT the anchor world. The anchor's region is derived from the ingested LOLA
# DEM's grid and its source is pinned by the digest of a file this repo does not contain, so it
# cannot be authored as a static document. What a starting spec should be is small, complete, and
# honest about what is synthetic — the spec is the *declaration*, and everything below is a knob
# you set deliberately, because `spec_hash` (hence `world_hash`) is computed over exactly these
# bytes. Two worlds that declare the same thing hash the same; a world that changes any of this is
# a different world.

world_id: example-polar-basin
version: 0.1.0
description: A small synthetic lunar south-polar world — the copyable WorldSpec example.

# The coordinate reference system, stated explicitly. There is no default and there must not be:
# an implicit Earth datum on a lunar body is a defaulting bug, and the loader rejects one outright
# (Core's `require_crs`; RFC-0007, LUNAR-TR-001). `astro_mine.worlds.crs` ships this exact CRS as
# LUNAR_SOUTH_POLAR_STEREOGRAPHIC, and `astro_mine.worlds.bodies` has the other bodies' defaults.
crs:
  body: MOON
  body_fixed_frame: MOON_ME
  datum: null
  reference_radius_m: 1737400.0
  projection: +proj=stere +lat_0=-90 +lat_ts=-90 +lon_0=0 +x_0=0 +y_0=0 +R=1737400.0
    +units=m +no_defs

# The declared extent, as a half-open [min, max) box in the CRS's projected metres, at the ground
# sample distance you intend. The *realized* grid comes from the terrain product — this is what the
# spec is authored against, and the build validates the product against it.
region:
  min_x_m: -5000.0
  min_y_m: -5000.0
  max_x_m: 5000.0
  max_y_m: 5000.0
  resolution_m: 20.0

# The source elevation product, cited by content hash so a world is reproducible from its inputs.
# `content_hash: null` is for a synthetic or illustrative source, which is what this is. Point this
# at a real DEM (e.g. a LOLA LDEM product) and pin its digest before anyone depends on the result.
source_dem:
  id: synthetic-polar-dem
  content_hash: null
  description: A synthetic illustrative DEM — replace with a real product and pin its content hash.

# Which derived layers this world enables, and the parameters that determine them. Terrain is
# always present (it establishes the grid); everything here is opt-in, and `null` means the layer
# is not part of this world.
#
# The illumination/PSR knobs are not tuning — they are the *definition* of the PSR mask. A permanent
# shadow is "never sunlit over the sampled window", so the window, the cadence, the horizon frame
# and the aberration correction each change what the mask is. They live in the spec so a mask is
# reproducible from the declaration alone rather than from whatever flags the build happened to use
# (worlds.md §10, the determinism gate).
layers:
  regolith_prior: default_lunar

  # null selects the precomputed horizon map; "raycast_cpu" / "raycast_gpu" / "surrogate:<name>"
  # select a finer or learned backend. A non-default backend is folded into the world hash, so the
  # product can always be attributed to the model that produced it.
  illumination_backend: null
  illumination_n_azimuth: 72

  # "grid" resolves one region-centre Sun across the raster; "topocentric" resolves it per cell.
  # The two disagree on shadow at the region edges, so the frame has to be declared.
  illumination_horizon_frame: grid
  illumination_max_radius_m: 8000.0
  illumination_abcorr: NONE

  # The PSR sampling window: start, duration in days, step in hours.
  psr_semantics: seasonal
  psr_start: '2025-01-01T00:00:00'
  psr_days: 365.0
  psr_step_hours: 12.0

  thermal_classes:
    - polar_lit
    - crater_floor

# A fixed reference datetime stamped onto STAC items — deterministic by design, never wall-clock,
# so the catalog is byte-reproducible.
reference_datetime: '2025-01-01T00:00:00Z'
