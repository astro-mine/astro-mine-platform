# Prometheus scrape config for the leaderboard (bench#32; bench.md §10).
#
#   docker compose --profile observability up
#
# Scrapes the FastAPI app's /metrics endpoint (astro_mine.bench.telemetry). Grafana provisions the
# starter dashboard in deploy/grafana/ against this datasource.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: astro-mine-bench-leaderboard
    metrics_path: /metrics
    static_configs:
      - targets: ["leaderboard:8000"]
        labels:
          component: bench
          tier: hosted
