# buf codegen — native C++ / Rust / TypeScript clients (RM-P0-CORE-07).
#
# Proves the narrow-waist message schemas generate and COMPILE in every language
# the platform targets (conventions.md §2; core.md §4). These outputs are build
# artifacts — generated fresh and compiled in CI and the conda dev env, never
# checked in (see codegen/ and .gitignore). The Python bindings are the only
# checked-in generation (buf.gen.yaml).
#
# Plugins are PINNED (CX-REPRO). The C++ plugin tracks the same v35 protobuf line
# as the Python runtime (compiled against conda-forge libprotobuf 7.35.1).
version: v2
plugins:
  - remote: buf.build/protocolbuffers/cpp:v35.1
    out: codegen/cpp/generated
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: codegen/rust/generated
  - remote: buf.build/bufbuild/es:v2.12.1
    out: codegen/ts/generated
    opt:
      - target=ts
