// SafetySpec v0.1 — canonical Protobuf wire form (RM-P1-GUARD-01).
//
// Mirrors the canonical JSON Schema (safety_spec.schema.json) and the Pydantic models
// (astro_mine.guard.spec.model). The authoritative *type* layer (closed vocabularies,
// required fields, fail-safe semantics) is the JSON Schema / Pydantic; closed-vocabulary
// fields are carried as `string` here so the round-trip stays byte-exact and drift-free
// (the Core SADF/objective pattern). Nullable scalars use proto3 `optional` to preserve
// presence (None vs default).
//
// Conventions: field tags are append-only and never reused (conventions.md §3). The
// SafetySpec is a safety contract — schema changes are additive and RFC-gated, and
// `buf breaking` gates the wire form. Bindings are generated with buf (scripts/gen_proto.sh).

syntax = "proto3";

package astro_mine.guard.spec.v0;

// The shared Core units/frames/time vocabulary (RFC-0007). Importing it is deliberate — the
// first cross-file import in Guard's proto set — so a SafetySpec frame is the *typed* Core
// `ReferenceFrame` on the wire, not a bare string re-derived per binding. Each `string frame`
// keeps its tag (wire-frozen, `buf breaking: use FILE`); the typed `frame_ref` is an additive
// sibling at the next free tag, matching Core's own `Volume.frame`/`frame_ref` (RFC-0007 §2).
import "astro_mine/core/units/_proto/units.proto";

message SafetyDocument {
  string safety_version = 1;  // "0.1"
  SafetySpec safety = 2;
}

message SafetySpec {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string scenario_ref = 4;
  repeated SignalRef signals = 5;
  repeated Constraint constraints = 6;
  optional Provenance provenance = 7;
  // The authored night-survival / charging pose the verified retreat (safe_state) backup drives
  // toward (RM-P1-GUARD-04). Additive, RFC-gated (extends the RFC-0004 SafetySpec). Absent => a
  // safe_state constraint's backup degrades to brake-to-stop.
  optional SafePose safe_pose = 8;
  // The reviewed MODE/TASK allowlist the action gate certifies against (RFC-0004 Amendment 2).
  // Additive, RFC-gated. Absent => the contract admits NO directive, whatever the deployment
  // configuration grants: config may only *narrow* this grant, never create a permission.
  optional AdmissibleDirectives admissible_directives = 9;
}

// An authored safe / charging pose: a body-fixed position (and, reserved for future non-point-mass
// plants, an optional attitude). The point-mass safety core consumes the position; the frame is
// validated against the keep-out geometry at authoring time (LUNAR-TR-001 — explicit body-fixed
// CRS, no implicit Earth frame).
message SafePose {
  string frame = 1;
  Vec3 position_m = 2;
  // Typed sibling of `frame` (RFC-0007): the retreat target's frame as a Core ReferenceFrame,
  // validated by require_frame. When set, its `name` must match `frame` (loader-enforced).
  optional astro_mine.core.units.v0.ReferenceFrame frame_ref = 3;
}

// The discrete directives this contract certifies, by *enumeration* (RFC-0004 Amendment 2).
//
// A MODE/TASK directive carries no continuous quantity the shield could project, so the trusted
// core can only certify it against a reviewed allowlist — and an admitted directive is re-emitted
// untouched. That makes the grant itself a safety decision, so it lives in the content-addressed,
// signed contract rather than in deployment config. The gate's effective allowlist is
// `spec INTERSECT config`; an absent/empty grant admits NOTHING (silence is the empty set, not
// "config stands").
//
// `tasks` carries Core TaskKind values; the closed vocabulary is enforced by the JSON
// Schema / Pydantic layer, and rides here as a string like every other closed vocabulary.
message AdmissibleDirectives {
  repeated string modes = 1;  // ModeCommand.mode names (open vocab: SADF loads_by_mode)
  repeated string tasks = 2;  // TaskKind (closed vocab carried as string)
}

message SignalRef {
  string key = 1;
  string unit = 2;
  string source = 3;  // SignalSource (closed vocab carried as string)
  optional string description = 4;
}

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Volume {
  string frame = 1;
  Vec3 center_m = 2;
  Vec3 dimensions_m = 3;
  // Typed sibling of `frame` (RFC-0007) — mirrors Core's `Volume.frame_ref` (the box keep-out
  // reuses Core's Volume, which now carries this field).
  optional astro_mine.core.units.v0.ReferenceFrame frame_ref = 4;
}

message Interval {
  double lo = 1;
  double hi = 2;
}

message KeepOutSphere {
  string frame = 1;
  Vec3 center_m = 2;
  double radius_m = 3;
  optional astro_mine.core.units.v0.ReferenceFrame frame_ref = 4;  // typed sibling of `frame` (RFC-0007)
}

message KeepOutHalfSpace {
  string frame = 1;
  Vec3 normal = 2;
  double offset_m = 3;
  optional astro_mine.core.units.v0.ReferenceFrame frame_ref = 4;  // typed sibling of `frame` (RFC-0007)
}

message KeepOutVolume {
  string shape = 1;  // GeometryKind (closed vocab carried as string)
  optional Volume box = 2;
  optional KeepOutSphere sphere = 3;
  optional KeepOutHalfSpace half_space = 4;
}

message STLFormula {
  string op = 1;  // TemporalOp (closed vocab carried as string)
  optional string signal = 2;
  optional string cmp = 3;  // PredicateOp (closed vocab carried as string)
  optional double threshold = 4;
  optional Interval interval_s = 5;
  repeated STLFormula args = 6;
}

message KeepOutConstraint {
  KeepOutVolume volume = 1;
  double margin_m = 2;
  repeated string collision_pair = 3;  // exactly 0 or 2 elements
}

message PowerFloorConstraint {
  string signal = 1;
  double floor_w = 2;
}

message EnergyFloorConstraint {
  string signal = 1;
  double floor_j = 2;
}

message ThermalCeilingConstraint {
  string signal = 1;
  double limit_k = 2;
}

message ThermalFloorConstraint {
  string signal = 1;
  double limit_k = 2;
}

message TorqueCeilingConstraint {
  string signal = 1;
  double max_nm = 2;
}

message KinematicLimitConstraint {
  string signal = 1;
  optional double max_velocity_mps = 2;
  optional double max_accel_mps2 = 3;
}

message TemporalConstraint {
  STLFormula formula = 1;
}

message Constraint {
  string kind = 1;  // ConstraintKind (closed vocab carried as string)
  string id = 2;
  string on_uncertain = 3;  // OnUncertain (closed vocab carried as string)
  optional string description = 4;
  optional KeepOutConstraint keep_out = 5;
  optional PowerFloorConstraint power_floor = 6;
  optional EnergyFloorConstraint energy_floor = 7;
  optional ThermalCeilingConstraint thermal_ceiling = 8;
  optional ThermalFloorConstraint thermal_floor = 9;
  optional TorqueCeilingConstraint torque_ceiling = 10;
  optional KinematicLimitConstraint kinematic_limit = 11;
  optional TemporalConstraint temporal = 12;
}

message Provenance {
  repeated string input_hashes = 1;
  optional string code_version = 2;
  optional string toolchain_version = 3;
  optional string env_lockfile = 4;
  optional int64 seed = 5;
}
