// SADF v0.1 — canonical Protobuf wire form (RM-P0-CORE-01).
//
// This mirrors the canonical JSON Schema (schemas/json/sadf/v0.1/) and the Pydantic
// models (astro_mine.core.sadf.model). It is the interchange/wire encoding; the
// authoritative *type* layer (closed vocabularies, required fields) is the JSON
// Schema / Pydantic. Closed-vocabulary fields are therefore carried as `string`
// here — validation happens upstream, and string<->string keeps the round-trip
// byte-exact and drift-free.
//
// Conventions: field tags are append-only and never reused (conventions.md §3).
// Nullable scalars use proto3 `optional` to preserve presence (None vs default).
// Bindings are generated with grpcio-tools as a stopgap; buf replaces it in
// RM-P0-CORE-07 (scripts/gen_proto.sh).

syntax = "proto3";

package astro_mine.core.sadf.v0;

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quat {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Transform {
  Vec3 translation_m = 1;
  Quat rotation_quat_xyzw = 2;
}

message Inertia {
  double ixx = 1;
  double iyy = 2;
  double izz = 3;
  double ixy = 4;
  double ixz = 5;
  double iyz = 6;
}

message Range {
  double min = 1;
  double max = 2;
}

message Frame {
  string name = 1;
  optional string parent = 2;
  Transform transform = 3;
  optional string spice_body_id = 4;
}

message GeometryRef {
  string role = 1;
  string format = 2;
  string uri = 3;
  string frame = 4;
  int32 lod = 5;
}

message Body {
  string name = 1;
  string frame = 2;
  double mass_kg = 3;
  Vec3 center_of_mass_m = 4;
  Inertia inertia_kg_m2 = 5;
}

message JointLimits {
  Range position_rad = 1;
  optional double velocity_rad_s = 2;
  optional double effort_nm = 3;
}

message Joint {
  string name = 1;
  string type = 2;
  string parent_body = 3;
  string child_body = 4;
  Vec3 axis = 5;
  JointLimits limits = 6;
}

message Actuator {
  string name = 1;
  optional string target_joint = 2;
  optional double torque_nm = 3;
  optional double force_n = 4;
  optional double velocity = 5;
  optional double power_draw_w = 6;
}

message PowerSource {
  string name = 1;
  string kind = 2;
  double nominal_power_w = 3;
}

message PowerStorage {
  string name = 1;
  double capacity_j = 2;
  optional double max_charge_w = 3;
  optional double max_discharge_w = 4;
}

message ModeLoad {
  string mode = 1;
  double power_w = 2;
}

message PowerBudget {
  repeated PowerSource sources = 1;
  repeated PowerStorage storage = 2;
  optional double floor_w = 3;
  repeated ModeLoad loads_by_mode = 4;
}

message ThermalBudget {
  Range operating_range_k = 1;
  Range survival_range_k = 2;
  optional double dissipation_w = 3;
  optional double radiator_area_m2 = 4;
  optional double heater_power_w = 5;
  bool surface_coupling = 6;
}

message ObservationModel {
  optional double noise_sigma = 1;
  optional double footprint_m2 = 2;
  optional double depth_response_m = 3;
  optional double range_m = 4;
  optional double fov_deg = 5;
}

message ResourceTarget {
  string species = 1;
  string si_unit = 2;
}

message Sensor {
  string name = 1;
  string kind = 2;
  string frame = 3;
  Transform pose = 4;
  ObservationModel observation_model = 5;
  ResourceTarget resource = 6;
}

message Antenna {
  optional double gain_dbi = 1;
  optional string gain_pattern = 2;
  optional string boresight_frame = 3;
  optional double pointing_accuracy_deg = 4;
}

message Comms {
  string name = 1;
  string band = 2;
  string node_role = 3;
  Antenna antenna = 4;
  optional double eirp_dbw = 5;
  optional double gt_db_per_k = 6;
  optional double tx_power_w = 7;
  optional double min_rate_bps = 8;
  optional double max_rate_bps = 9;
  repeated string modcod_supported = 10;
  repeated string protocols = 11;
  bool relay = 12;
}

message ContactElement {
  string kind = 1;
  Vec3 dimensions_m = 2;
  optional double footprint_m2 = 3;
  optional double max_ground_pressure_pa = 4;
  optional double max_slope_deg = 5;
}

message Anchoring {
  double max_force_n = 1;
}

message Mobility {
  repeated string regimes = 1;
  repeated ContactElement contact = 2;
  Anchoring anchoring = 3;
}

message Propellant {
  string type = 1;
  double mass_kg = 2;
}

message PropulsionSystem {
  string kind = 1;
  optional double thrust_n = 2;
  optional double isp_s = 3;
  Propellant propellant = 4;
  optional double power_w = 5;
}

message Stage {
  double dry_kg = 1;
  double propellant_kg = 2;
}

message Propulsion {
  repeated PropulsionSystem systems = 1;
  optional double delta_v_budget_mps = 2;
  repeated Stage staging = 3;
}

message ReturnSpec {
  string capability = 1;
  optional double payload_capacity_kg = 2;
  string earth_interface = 3;
}

message Isru {
  optional double throughput_kg_hr = 1;
  optional double plant_power_w = 2;
}

message PayloadSlot {
  string name = 1;
  string frame = 2;
  repeated string accepts = 3;
  optional double max_mass_kg = 4;
}

message PayloadSpec {
  repeated PayloadSlot slots = 1;
  Isru isru = 2;
  optional double capacity_kg = 3;
}

message SubAssembly {
  string ref = 1;
  string mount_frame = 2;
  Transform transform = 3;
}

message SurrogateProfile {
  string physics_domain = 1;
  optional string trust_region = 2;
}

message FidelityProfile {
  string tier = 1;
  string determinism_class = 2;
  optional string detail = 3;
  SurrogateProfile surrogate = 4;
}

message Interfaces {
  optional string observation_space = 1;
  optional string action_space = 2;
}

message Provenance {
  repeated string input_hashes = 1;
  optional string code_version = 2;
  optional string toolchain_version = 3;
  optional string env_lockfile = 4;
  optional int64 seed = 5;
}

message Identity {
  string id = 1;
  string name = 2;
  string version = 3;
  string kind = 4;
  optional string description = 5;
  map<string, string> labels = 6;
}

message Asset {
  Identity identity = 1;
  repeated string capabilities = 2;
  map<string, string> core_interface_versions = 3;
  repeated Frame frames = 4;
  string root_frame = 5;
  repeated GeometryRef geometry = 6;
  repeated Body bodies = 7;
  repeated Joint joints = 8;
  repeated Actuator actuators = 9;
  PowerBudget power = 10;
  ThermalBudget thermal = 11;
  repeated Sensor sensors = 12;
  repeated Comms comms = 13;
  Mobility mobility = 14;
  Propulsion propulsion = 15;
  ReturnSpec return_spec = 16;  // model field `return` (Python keyword)
  PayloadSpec payload = 17;
  repeated SubAssembly subassemblies = 18;
  repeated FidelityProfile fidelity_profiles = 19;
  repeated string flight_stacks = 20;
  Interfaces interfaces = 21;
  Provenance provenance = 22;
}

message SadfDocument {
  string sadf_version = 1;
  Asset asset = 2;
}
