// ObjectiveSpec v0.1 — canonical Protobuf wire form (RM-P0-CORE-04).
//
// Mirrors the canonical JSON Schema (objective.schema.json) and the Pydantic models
// (astro_mine.core.objective.model). The authoritative *type* layer (closed
// vocabularies, required fields) is the JSON Schema / Pydantic; closed-vocabulary
// fields are carried as `string` here so the round-trip stays byte-exact and
// drift-free (the SADF pattern, RM-P0-CORE-01).
//
// Conventions: field tags are append-only and never reused (conventions.md §3).
// Nullable scalars use proto3 `optional` to preserve presence (None vs default).
// Bindings are generated with grpcio-tools as a stopgap; buf replaces it in
// RM-P0-CORE-07 (scripts/gen_proto.sh).

syntax = "proto3";

package astro_mine.core.objective.v0;

message ObjectiveDocument {
  string objective_version = 1;  // "0.1"
  ObjectiveSpec objective = 2;
}

message ObjectiveSpec {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string scenario_ref = 4;
  repeated SuccessCriterion success_criteria = 5;
  map<string, string> labels = 6;
  optional Provenance provenance = 7;
}

message SuccessCriterion {
  string id = 1;
  optional string description = 2;
  MetricBinding binding = 3;
  bool required = 4;
  optional double weight = 5;
  optional double deadline_s = 6;  // achieve-by deadline, SI seconds of episode/sim time
}

message EvaluationWindow {
  string kind = 1;  // WindowKind (closed vocab carried as string)
  optional double duration_s = 2;
}

message MetricBinding {
  string metric = 1;
  string unit = 2;
  string direction = 3;    // MetricDirection (closed vocab carried as string)
  double target = 4;
  double tolerance = 5;
  string aggregation = 6;  // MetricAggregation (closed vocab carried as string)
  optional double threshold = 7;
  optional EvaluationWindow evaluation_window = 8;
  // Tag 9+ reserved for the Ledger value-model binding (P3, RFC-0001) — out of
  // scope for RM-P0-CORE-04.
}

message Provenance {
  repeated string input_hashes = 1;
  optional string code_version = 2;
  optional string toolchain_version = 3;
  optional string env_lockfile = 4;
  optional int64 seed = 5;
}
