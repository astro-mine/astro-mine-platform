# buf module config (RM-P1-SURR-01). The canonical .proto sources live under
# schemas/proto; buf lints them, gates breaking changes, and generates the Python
# bindings (see buf.gen.yaml). Mirrors astro-mine-core's setup.
version: v2
modules:
  - path: schemas/proto
lint:
  use:
    - STANDARD
  except:
    # Surrogate keeps its wire form in `<pkg>/_proto/` so generated bindings land at
    # astro_mine.surrogate._proto.* — the import path astro_mine.surrogate.wire builds
    # against. That diverges from buf's package==directory convention deliberately.
    - PACKAGE_DIRECTORY_MATCH
    # Interfaces are versioned pre-1.0 during Phase 1 (`.v0`, matching the JSON Schema
    # `$id .../v0.1/...` and the per-interface SemVer scheme). buf's version-suffix rule
    # only accepts `v1`+, so it is waived until the Phase-0/1 interface freeze reaches v1.
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
