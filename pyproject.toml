# astro-mine-platform — the consolidated single-package distribution of the Astro-Mine
# Python platform. Every component repo's `astro_mine.<comp>` subpackage ships here,
# unchanged, as one wheel. See docs/CONSOLIDATION_PLAN.md for the migration contract:
# code is copied mechanically from the component repos; only imports/packaging/dist-name
# couplings were adjusted. REST API surfaces (hub.api, studio.api, cloud.serve,
# bench.leaderboard) and the TS/React UIs are deliberately NOT migrated.
#
# Build backend is maturin (not hatchling) because the wheel bundles Guard's trusted
# Rust safety core as the PyO3 extension `astro_mine.guard._core` (guard.md §4) — the
# same mixed src/ + rust/ layout astro-mine-guard used, widened to the whole platform.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "astro-mine-platform"
version = "0.1.0"
description = "Astro-Mine-Platform — the consolidated Astro-Mine stack as one library: Core, Spice, Seal, Worlds, Prospect, Link, Fleet, Sim, Bench, Cloud, Surrogate, Mind, Learn, Allocate, Guard, Hub and Studio. The CLI is astro-mine-cli."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Astro-Mine project contributors" }]
keywords = ["astro-mine", "swarm-robotics", "isru", "simulation", "autonomy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
]

# The union of every component repo's *base* runtime dependencies. Specs are the
# per-repo specs verbatim; where repos disagreed the intersection is kept (noted).
# Internal astro-mine-* pins disappear: components are now in-package.
dependencies = [
  # core
  "pydantic>=2.7",          # core, sim, bench, link, mind, cloud
  "svcs>=25.1",             # the composition roots ONLY (conventions.md §3.3); no component
                            # may import it, and the layering suite fails the build if one does
  "jsonschema>=4.22",       # core, guard, mind, studio
  "referencing>=0.35",      # core
  "pyyaml>=6.0",            # core, worlds, mind, guard, hub  (hub said >=6; same set)
  "protobuf>=7.35,<8",      # core, allocate, guard, surrogate
  "pycapnp>=2.2.3",         # core
  # spice / worlds / prospect / link / fleet / surrogate / learn / studio
  "numpy>=2.5.1",           # >=1.26 everywhere except studio's >=2.5.1 → intersection
  "scipy>=1.18.0",          # prospect >=1.11, studio >=1.18.0 → intersection
  "spiceypy>=6.0",          # spice
  "rasterio>=1.3",          # worlds
  "zarr>=3.0",              # worlds, link
  "gpytorch>=1.11",         # prospect
  "torch>=2.2",             # prospect, surrogate (CPU index via [tool.uv] below)
  "pyarrow>=17",            # link
  "trimesh>=4.12.2",        # fleet
  "usd-core>=26.5",         # fleet
  "yourdfpy>=0.0.60",       # fleet
  # sim
  "mcap>=1.4.0",            # sim
  # learn
  "gymnasium==1.2.2",       # learn (Ray 2.56 exact-pins this; do not bump)
  "pettingzoo>=1.24",       # learn
  # allocate
  "ortools>=9.10,<9.11",    # allocate
  # seal / guard
  "cryptography>=42",       # seal, guard
  # hub (client; the REST service is not migrated)
  "packaging>=24",          # hub
  # NOTE: fastapi was a base dep only of astro-mine-studio, used exclusively by the
  # not-migrated studio.api REST surface; it is intentionally absent here.
]

# Extras are component-prefixed (`<comp>-<extra>`) because the per-repo extra names
# collided in one distribution (three `recording`s, three `cloud`s, …). Extras whose
# only content was a sibling astro-mine package are kept as empty markers so existing
# `pip install …[extra]` invocations still resolve — the sibling is now always present.
[project.optional-dependencies]
# bench
# bench[leaderboard] minus fastapi/uvicorn: the REST route module is not
# migrated, but the leaderboard *library* (_service/_sql/_auth/_authz/...) is.
bench-leaderboard = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pyjwt[crypto]>=2.8", "httpx>=0.27"]
bench-recording = ["mcap>=1.4"]
bench-observability = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "prometheus-client>=0.20"]
bench-submit = ["httpx>=0.27"]
bench-cloud = ["pyarrow>=16"]
bench-fetch = []                       # was: astro-mine-hub (now in-package)
# cloud (cloud[serve] not migrated — REST)
cloud-cluster = ["pyyaml>=6"]
cloud-mlflow = ["mlflow>=2.14"]
cloud-nats = ["nats-py>=2.6"]
cloud-redis = ["redis>=5.0"]
cloud-s3 = ["boto3>=1.34"]
# guard
guard-recording = ["mcap>=1.4"]
guard-metrics = ["pyarrow>=16"]
guard-mind = []                        # was: astro-mine-mind
guard-sim = ["onnx>=1.17", "onnxruntime>=1.19"]
# learn
learn-rllib = ["ray[rllib]>=2.54,<2.57", "torch>=2.4"]
learn-eval = ["pyarrow>=15"]
learn-export = ["onnx>=1.17", "onnxruntime>=1.19"]
learn-jax = ["jax>=0.4.35"]
learn-mlflow = ["mlflow"]
# link
link-hub = []                          # was: astro-mine-hub
# mind
mind-native = ["ompl>=2.0", "python-fcl>=0.7"]
mind-onnx = ["onnxruntime>=1.19", "onnx>=1.17"]
mind-pddl = ["unified-planning>=1.1", "up-fast-downward>=0.5"]
mind-recording = ["mcap>=1.4"]
mind-sim = []                          # was: astro-mine-sim[bench,hub] + guard + allocate
# prospect (prospect[service] is gRPC, not REST — migrated)
prospect-ingest = ["rasterio>=1.3"]
prospect-publish = []                  # was: astro-mine-hub
prospect-service = ["grpcio>=1.60", "protobuf>=7.35,<8", "pyjwt[crypto]>=2.8"]
prospect-zarr = ["zarr>=3.0"]
# sim
sim-bench = []                         # was: astro-mine-bench
sim-brax = ["jax>=0.4.34", "brax>=0.10", "mujoco>=3.2"]
sim-cloud = []                         # was: astro-mine-cloud
sim-dem = ["numpy>=1.26"]
sim-hub = []                           # was: astro-mine-hub
sim-mujoco = ["mujoco>=3.2", "numpy>=1.26"]
sim-orekit = ["orekit-jpype>=13.1", "jdk4py>=21"]
sim-ray = ["ray>=2.40"]
sim-report = ["pyarrow>=16"]
sim-service = ["grpcio>=1.60", "protobuf>=4.25", "flatbuffers>=24.3"]
sim-surrogate = ["numpy>=1.26", "onnxruntime>=1.18"]
# studio (studio[serve] not migrated — it served the REST API; [llm]/[optuna] are library-side)
studio-cloud = []                      # was: astro-mine-cloud
studio-hub = []                        # was: astro-mine-hub
studio-llm = ["anthropic>=0.116.0"]
studio-optuna = ["optuna>=4.0"]
# surrogate
surrogate-datagen = []                 # was: astro-mine-sim[dem]
surrogate-datasets = ["zarr>=3.0", "pyarrow>=16", "scipy>=1.11"]
surrogate-publish = []                 # was: astro-mine-hub
surrogate-serve = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.2"]
# worlds
worlds-gpu = ["cupy-cuda12x>=13"]
worlds-hub = []                        # was: astro-mine-hub
worlds-surrogate = ["onnxruntime>=1.18"]
# allocate
allocate-mind = []                     # was: astro-mine-mind

[project.urls]
Homepage = "https://github.com/astro-mine/astro-mine-platform"
Issues = "https://github.com/astro-mine/astro-mine-platform/issues"

# This distribution ships NO console scripts and NO `astro_mine.cli*` entry points. Every
# command lives in astro-mine-cli, which depends on this package and is the platform's only
# CLI (astro-mine-platform#1 / astro-mine-cli#12; supersedes RFC-0011 §1/§2/§4/§5).
#
# The four groups below are the *plugin* registries the Core plugin system resolves. They are
# not command surface and are untouched by that change.
[project.entry-points."astro_mine.providers"]
comms_model = "astro_mine.link.registry:from_bundle"
observation_model = "astro_mine.prospect.sensors:likelihood_from_manifest"
prior_recipe = "astro_mine.prospect.belief:belief_from_bundle"
resource_field_backend = "astro_mine.prospect.publish:from_bundle"
world_provider = "astro_mine.worlds.provider:DemWorldProvider.from_bundle"

[project.entry-points."astro_mine.field_models"]
horizon = "astro_mine.worlds.illumination._registry:horizon_field_model"
raycast_cpu = "astro_mine.worlds.illumination._registry:raycast_cpu_field_model"
raycast_gpu = "astro_mine.worlds.illumination._registry:raycast_gpu_field_model"
surrogate = "astro_mine.worlds.illumination._registry:surrogate_field_model"

[project.entry-points."astro_mine.bench.runners"]
sim = "astro_mine.sim.bench:sim_runner_provider"

[project.entry-points."astro_mine.mind.tier_plugins"]
"allocate.planner" = "astro_mine.allocate.mind:allocation_planner_plugin"
"guard.shield" = "astro_mine.guard.mind.plugin:guard_shield_plugin"
"mind.allocate.greedy" = "astro_mine.mind.mission.allocate.reference:greedy_allocator_plugin"
"mind.control.mpc" = "astro_mine.mind.control.reference:mpc_control_plugin"
"mind.control.onnx" = "astro_mine.mind.control.policy.onnx_tier:onnx_control_plugin"
"mind.control.pid" = "astro_mine.mind.control.reference:pid_control_plugin"
"mind.mission.pddl" = "astro_mine.mind.mission.planner.reference:pddl_mission_plugin"
"mind.mission.up" = "astro_mine.mind.mission.planner.native:up_mission_plugin"
"mind.reference.constraint_shield" = "astro_mine.mind.reference.tiers:constraint_shield_plugin"
"mind.reference.control" = "astro_mine.mind.reference.tiers:control_plugin"
"mind.reference.mission" = "astro_mine.mind.reference.tiers:mission_plugin"
"mind.reference.shield" = "astro_mine.mind.reference.tiers:shield_plugin"
"mind.reference.tamp" = "astro_mine.mind.reference.tiers:tamp_plugin"
"mind.tamp.ompl" = "astro_mine.mind.tamp.motion.native:ompl_tamp_plugin"
"mind.tamp.sampling" = "astro_mine.mind.tamp.reference:sampling_tamp_plugin"

[tool.maturin]
# Mixed Rust/Python layout inherited from astro-mine-guard: the whole Python tree under
# src/, Guard's Rust extension crate under rust/, compiled into astro_mine.guard._core.
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "astro_mine.guard._core"
features = ["python"]
# Non-.py package data the per-repo builds shipped (worlds' hatch force-include,
# surrogate's hatch force-include, hub's hatch artifacts). Maturin includes
# python-source package data by default; these are pinned explicitly because
# they are load-bearing (importlib.resources reads at runtime).
include = [
  { path = "src/astro_mine/worlds/illumination/schema/*.json", format = ["sdist", "wheel"] },
  { path = "src/astro_mine/worlds/spec/examples/*.yaml", format = ["sdist", "wheel"] },
  { path = "src/astro_mine/worlds/spec/schema/*.json", format = ["sdist", "wheel"] },
  { path = "src/astro_mine/surrogate/data/dem_excavation_v1.npz", format = ["sdist", "wheel"] },
  { path = "src/astro_mine/hub/policy/rego/*", format = ["sdist", "wheel"] },
  # The trust root travels with the code, because a gate must be able to decide "whose signature
  # counts" on a laptop with no network (conventions.md §9, CX-LOCAL). A root that has to be
  # fetched is a root the offline tier does not have, and `importlib.resources` reads this at
  # runtime — so an omission here is a silent downgrade to "trust nobody", not a build error.
  { path = "src/astro_mine/seal/trust_root.json", format = ["sdist", "wheel"] },
]

# Dev tooling: the union of every repo's dev dependency-group (loosest-compatible spec
# kept where repos disagreed). Heavy opt-in stacks stay behind the extras above.
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.100",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "types-jsonschema>=4.22",
  "types-protobuf",
  "types-pyyaml>=6.0",
  # What each source repo's *default* CI suite imports (union of the per-repo
  # dev groups, minus fastapi/uvicorn which only the excluded REST tests used):
  "mcap>=1.4",
  "pyarrow>=16",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.2",
  "zarr>=3.0",
  "moto[s3]>=5.0",
  "fakeredis>=2.20",
  "mlflow-skinny>=2.14",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyjwt[crypto]>=2.8",
  "pgvector>=0.3",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "prometheus-client>=0.20",
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  "flatbuffers>=24.3",
  "datamodel-code-generator>=0.25",
  "optuna>=4.0",
  "anthropic>=0.116.0",
  "ray[rllib]>=2.54,<2.57",
  # sim's dev group ran its brax/mujoco/orekit engine tests in default CI:
  "jax>=0.4.34",
  "brax>=0.10",
  "mujoco>=3.2",
  "orekit-jpype>=13.1",
  "jdk4py>=21",
  "gmat-run>=0.6 ; python_version < '3.13'",
]

[tool.uv]
# Torch from the CPU index (the prospect/surrogate/learn pattern) — never the CUDA wheel.
index = [{ name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true }]
# learn's resolution fork, carried over with the prefixed extra names.
conflicts = [[{ extra = "learn-rllib" }, { extra = "learn-mlflow" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Union of every component repo's marker registrations (same names kept the same meaning).
markers = [
  "gpu: requires a CUDA GPU (deselected in CI)",
  "realdata: requires the real LOLA DEM + NAIF kernels (skipped in CI)",
  "ray: requires Ray (live cluster where noted); deselected where the source repo deselected it",
  "docker: requires a live Docker daemon (opt-in)",
  "cluster: opt-in integration test against a live Kubernetes/Ray cluster",
  "container: opt-in test that runs inside a real container sandbox",
  "postgres: needs a live PostgreSQL with pgvector",
  "minio: opt-in integration test against a real local MinIO",
  "slow: long-running; deselected in CI",
  "mlflow: opt-in integration test against a real MLflow server",
  "nats: opt-in integration test against a real NATS+JetStream server",
  "onnx: needs the onnx/onnxruntime extra",
  "recording: needs the mcap recording extra",
  "pddl: needs the unified-planning PDDL extra; deselected in CI",
  "native: needs the OMPL/FCL native extra; deselected in CI",
  "sim: real-Sim end-to-end integration (dedicated CI job)",
  "integration: heavier integration tests (dedicated CI job)",
  "scale: wall-clock-bound scale benchmark; opt-in",
]

[tool.coverage.run]
source = ["src/astro_mine"]
omit = [
  # buf/protoc-generated bindings are not hand-maintained code
  "*/_proto/*",
  # per-repo omits, union: bench/hub/cli omitted __main__ shims; mind omitted
  # its native (OMPL/FCL) backends; studio its orchestrate worker __main__
  "*/__main__.py",
  # mind's upstream omit: native (OMPL/FCL) backends are deselected in CI
  "*/native/*",
]

# Byte-identical across all 18 source repos.
[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
  "@(typing\\.)?overload",
]

# Type checking (conventions.md §2: Python is "type-hinted, checked with mypy/pyright").
#
# `strict = true` over the whole tree, run as a **per-component ratchet** rather than a flag day.
# One wheel with no package boundaries makes a wrong signature everyone's problem, so the gate
# matters more here than anywhere -- but 110k lines migrated from seventeen repositories cannot be
# made strict-clean in one change. The seed is the set that already passes; the components that do
# not are listed below one block each, with their error count, and the build fails on a regression
# in any of the rest. Widening the enrolled set is the point; `tests/platform/test_typecheck_ratchet.py`
# is what stops it from silently narrowing.
#
# Scope is `src/astro_mine`. Lint covers `src tests scripts`; this does not, and saying so is
# better than a gate that looks wider than it is. Widening to tests/ and scripts/ is a later step.
[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# protoc/buf-generated bindings are not hand-maintained code -- the same judgement `[tool.ruff]`
# extend-exclude and `[tool.coverage.run]` omit already make about this exact glob.
#
# `ignore_errors`, deliberately, and NOT `follow_imports = "skip"`: skipping would turn every
# generated message into `Any` and silently drop type coverage from every component that speaks
# Core's schemas -- which is most of them. This suppresses errors *inside* the generated files
# while keeping their types available to callers.
module = ["astro_mine.*._proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Two dependencies that ship types too incomplete to check against.
#
# `mcap` is not merely incomplete: mypy resolves its `__init__.py` under two module names at once
# and aborts the whole run with "Source file found twice" -- a fatal error, not a finding, so it
# reports "errors prevented further checking" and type-checks *nothing*. That failure hid five real
# errors in astro-mine-cli (astro-mine-cli#31) and hides this entire tree if left alone.
#
# `pyarrow` ships inline annotations, but `parquet.read_table`/`write_table` are untyped, so every
# call site fails `disallow_untyped_calls` -- which is what kept Guard and Bench, both otherwise
# clean, out of the enrolled set below.
#
# `follow_imports = skip` rather than `ignore_missing_imports`: both packages are present, and the
# problem is what they declare about themselves, not a missing stub.
module = ["mcap.*", "pyarrow.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Third-party packages with neither a stub package nor a `py.typed` marker, listed one by one
# rather than switched on globally: a blanket `ignore_missing_imports` would also swallow a typo
# in one of our own module paths.
#
# Several of these (ompl, fcl, unified_planning, cupy, nats) are optional extras absent from the
# `dev` group, so they are unresolvable in CI as well as untyped. Listing them keeps the result
# identical whether or not an extra happens to be installed.
module = [
  "boto3.*",
  "capnp.*",
  "cupy.*",
  "fcl.*",
  "flatbuffers.*",
  "gpytorch.*",
  "grpc.*",
  "mujoco.*",
  "nats.*",
  "ompl.*",
  "onnxruntime.*",
  "orekit_jpype.*",
  "pettingzoo.*",
  "pxr.*",
  "rasterio.*",
  "scipy.*",
  "spiceypy.*",
  "unified_planning.*",
  "yourdfpy.*",
]
ignore_missing_imports = true

# --- The ratchet -------------------------------------------------------------------------------
#
# Four components are not yet enrolled. Each gets its own block with its error count, because a
# single merged exemption list hides which one is close to clean and which is not. These are debts
# with a number attached, not exemptions: shrink the list, never grow it. The counts are from
# `uv run mypy src/astro_mine` with the overrides above and are expected to drift as the code
# changes -- they are a sense of scale, not an assertion.
#
# Enrolled and clean: core, spice, seal, worlds, prospect, link, cloud, mind, hub, studio,
# allocate, guard, bench.

[[tool.mypy.overrides]]
# 29 errors, nearly all in `datagen/store.py` and `serve/export.py`: unparameterized generics
# (`np.ndarray`, `dict`) on the dataset-shard and ONNX-export paths.
module = ["astro_mine.surrogate.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# 17 errors. Ray/RLlib is the bulk of it -- `PPOConfig` and friends are untyped, and RLlib's
# `.remote()` actor handles are invisible to mypy -- plus unparameterized tensors in `models/mlp.py`.
module = ["astro_mine.learn.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# 7 errors, all downstream of `trimesh`: it ships `py.typed` while leaving `apply_scale`,
# `TextureVisuals`, `PBRMaterial` and `export` unannotated, so the geometry and exporter paths fail
# on untyped calls and the `Any` they return. Enrolling this one is mostly a stub question.
module = ["astro_mine.fleet.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# 6 errors: generated gRPC servicer/stub calls in `service/`, and Ray/Brax `.remote()` and
# `.update()` handles in `engines/brax/`. Note this is the component whose `-m sim` suite the
# `sim-e2e` job could never run.
module = ["astro_mine.sim.*"]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["**/_proto"]

[tool.ruff.lint]
# The rule set every source repo used.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Five skipped tests still reference `run.main`, the argv entry point removed with the CLI
# surface (astro-mine-platform#1). They are kept, not deleted, because they assert *export*
# behaviour -- package validity, provenance folding, digest stability, atomicity -- and only
# used argv as a driver. The ignore goes away when they are repointed at
# train()/export_trained_policy(); until then it is better than deleting the coverage or
# faking a `main` that would mislead the next reader.
"tests/learn/train/test_run.py" = ["F821"]
# Pre-existing over-long line copied verbatim from astro-mine-prospect.
"src/astro_mine/prospect/publish/_publish.py" = ["E501"]
