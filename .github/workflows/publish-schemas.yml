# Publish the content-addressed Core schema bundle to private GHCR (RM-P0-CORE-08).
#
# Rehomed from `astro-mine-core` before that repository was deleted (RM-DIST-05). The consolidation
# moved the bundle *builder* (`scripts/build_schema_bundle.py`) and the schema sources into this
# wheel and left the workflow that publishes them behind -- so the capability survived and the
# automation did not. Archiving makes a repository's Actions unrunnable, which would have retired
# this publisher with nothing replacing it, and the bundle's `schema_digest` is the content-addressed
# identity a Bench run pins (VERSIONING.md §5; core.md §7).
#
# On every `vX.Y.Z` tag (and on demand via workflow_dispatch for an existing tag), this
# assembles the canonical schema set + freshly generated per-language clients into a
# bundle and pushes it as an OCI artifact to ghcr.io/<org>/astro-mine-platform/schemas,
# pullable by digest. The bundle's `schema_digest` (sha256 over the schema sources) is
# the content-addressed identity a Bench run pins (docs/VERSIONING.md §5; core.md §7).
#
# Auth: the workflow's own GITHUB_TOKEN (packages: write) — no PAT. Downstream *read*
# of this private package uses CORE_REPO_TOKEN (see CONTRIBUTING.md).
name: Publish schema bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0. Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Never run from forks — the GHCR target and token are org-scoped.
    if: github.repository_owner == 'astro-mine'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      # This was `ghcr.io/astro-mine/astro-mine-core/schemas` when the workflow was rehomed, on the
      # reasoning that registry names are immutable and re-targeting would orphan the consumers of
      # the already-published package. That reasoning assumed `astro-mine-core` would survive as an
      # archived repository. It was deleted (RM-DIST-05), and a GHCR package scoped under a repo
      # path goes with the repo -- so there is no longer a published package to orphan, and the old
      # path resolves to nothing.
      #
      # `${{ github.repository }}/schemas` rather than a literal, so the target follows the
      # repository that publishes it instead of naming one that can be deleted out from under it.
      IMAGE: ghcr.io/${{ github.repository }}/schemas
    steps:
      - name: Resolve tag & version
        id: ref
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::expected a vX.Y.Z tag, got '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # THE CONTENT comes from the tag. Everything the bundle's identity is computed over --
      # the canonical JSON Schemas and .proto sources -- is whatever `$TAG` recorded.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0 # tags needed for hatch-vcs / provenance

      - name: Record the content commit
        id: content
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # THE TOOLING comes from the ref this workflow was dispatched on.
      #
      # A `workflow_dispatch` with a `tag` input promises to re-publish an existing tag, and until
      # now it could not deliver that for any tag at all. `scripts/core/gen_proto.sh` had been moved
      # from `scripts/` to `scripts/core/` without its `cd ..` following, so it ran `buf` from a
      # directory with no `buf.yaml`; every tag cut before that was fixed carries the broken copy,
      # and a checkout of the tag brings the break with it. `v0.1.0` -- the only tag -- is one of
      # them (astro-mine-platform#49, #58).
      #
      # So a tag supplies what it *is*, and this ref supplies what *builds* it. That is a real
      # narrowing of the claim and it is stated here rather than left to be discovered: this
      # publishes `$TAG`'s schemas as generated by today's tooling, not a bit-for-bit reconstruction
      # of what `$TAG` would have produced on the day it was cut.
      #
      # **What makes the narrowing safe is where the identity is computed.**
      # `build_schema_bundle.py` derives `schema_digest` from the canonical schema *sources* only --
      # the generated clients "ride along as a convenience but are *not* part of the pinnable
      # identity" (its module docstring). So the digest a `ScenarioSpec` pins stays a pure function
      # of the tag's schemas; only the convenience payload reflects the newer buf.
      #
      # On the `push: tags` trigger this is a no-op by construction: `github.sha` *is* the tag's
      # commit, so the overlay restores the same bytes. It only does anything when re-publishing an
      # older tag on demand, which is the case it exists for.
      - name: Overlay the build tooling from ${{ github.ref_name }}
        id: tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.sha }}"
          # Build configuration, not content: the generators, the buf module + pinned plugin
          # versions, and the conda toolchain. `schemas/` is deliberately absent.
          git checkout "${{ github.sha }}" -- \
            scripts buf.yaml buf.gen.yaml buf.gen.langs.yaml environment.yml
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          # Say what it changed. An overlay that silently rewrites nothing and an overlay that
          # silently rewrites everything look identical in a green log.
          echo "### Tooling overlay" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet HEAD --; then
            echo "No difference — the tag already carries this tooling." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo '```'
              git diff --stat HEAD --
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up codegen toolchain (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # Generate the per-language client sources published alongside the schemas.
      #
      # These are shipped without anything ever compiling them. This step used to claim "The CI
      # `codegen` job already proves they compile" -- there is no such job in `ci.yml`; it stayed
      # behind in `astro-mine-core` when the workflow was rehomed, and the sentence came across
      # unchanged. Tracked in astro-mine-platform#59. A false statement about what is checked is
      # worse than an unchecked artifact, because it stops the next reader looking.
      - name: Generate per-language clients (C++/Rust/TS)
        run: ./scripts/core/gen_proto.sh --langs

      # `--commit` is the *content* commit, not `github.sha`. On a dispatch they differ -- the
      # workflow's sha is this ref's head -- so passing `github.sha` here stamped a v0.1.0 bundle
      # with main's commit. It was latent while the only trigger that reached this step was
      # `push: tags`, where the two are the same; the overlay above makes it material.
      - name: Build schema bundle
        run: |
          python scripts/build_schema_bundle.py \
            --out dist/schema-bundle \
            --clients-dir codegen \
            --version "${{ steps.ref.outputs.version }}" \
            --commit "${{ steps.content.outputs.sha }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push bundle to GHCR (by digest)
        id: push
        run: |
          set -euo pipefail
          VERSION="${{ steps.ref.outputs.version }}"
          DIGEST="$(cat dist/schema-bundle/SCHEMA_DIGEST)"
          # Deterministic tarball of the staged bundle (sorted, zeroed metadata).
          # Named for the repository that publishes it. It carried `astro-mine-core-` while the
          # target did; both moved together, because a layer filename that names a deleted
          # repository is the same stale reference as the target was.
          TARBALL="astro-mine-platform-schemas-${VERSION}.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -czf "$TARBALL" -C dist/schema-bundle .
          # `revision` is the *content* commit -- the tag's -- because that is what the artifact
          # is a build of. The tooling commit rides alongside under its own key rather than
          # overwriting it: a consumer asking "which schemas is this?" and one asking "what built
          # it?" are asking different questions, and one annotation cannot answer both.
          oras push "$IMAGE:$VERSION" \
            --artifact-type application/vnd.astro-mine.core.schema-bundle.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ steps.content.outputs.sha }}" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "dev.astro-mine.schema-digest=$DIGEST" \
            --annotation "dev.astro-mine.tooling-revision=${{ steps.tooling.outputs.sha }}" \
            "$TARBALL:application/gzip" | tee push.log
          REG_DIGEST="$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)"
          [ -n "$REG_DIGEST" ] || { echo "::error::could not parse registry digest"; exit 1; }
          echo "schema_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "registry_digest=$REG_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify pull-by-digest
        run: |
          set -euo pipefail
          oras manifest fetch "$IMAGE@${{ steps.push.outputs.registry_digest }}" > /dev/null
          echo "pull-by-digest OK"

      - name: Summary
        run: |
          {
            echo "### Core schema bundle published"
            echo ""
            echo "- **Version:** \`${{ steps.ref.outputs.version }}\`"
            echo "- **Schema digest (content-addressed):** \`${{ steps.push.outputs.schema_digest }}\`"
            echo "- **Registry ref:** \`$IMAGE:${{ steps.ref.outputs.version }}\`"
            echo "- **Registry digest:** \`${{ steps.push.outputs.registry_digest }}\`"
            echo "- **Content commit (\`${{ steps.ref.outputs.tag }}\`):** \`${{ steps.content.outputs.sha }}\`"
            echo "- **Tooling commit (\`${{ github.ref_name }}\`):** \`${{ steps.tooling.outputs.sha }}\`"
            echo ""
            echo "Pull by digest:"
            echo '```'
            echo "oras pull $IMAGE@${{ steps.push.outputs.registry_digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
