name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The `sim-e2e` job below gates on `github.event_name == 'workflow_dispatch'`, and this trigger
  # was missing -- so the condition was never true, the job skipped on every run since the
  # consolidation, and the `-m sim` suites in tests/guard and tests/mind ran nowhere at all.
  # A job that can only be triggered manually still needs the manual trigger to exist.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Lint only — the migrated sources are copied verbatim from repos that
      # were not uniformly ruff-format-normalized; reformatting is churn.
      - run: uv run --group dev ruff check src tests scripts

  # conventions.md §2 requires Python to be checked with mypy/pyright, and nothing checked it:
  # `mypy` sat in the `dev` group with no configuration and no step to run it. The gate is a
  # per-component ratchet — see the long note over `[tool.mypy]` in pyproject.toml for the enrolled
  # set, the four components that are not, and why the exclusions are shaped the way they are.
  #
  # Unlike `lint`, this needs the package built and its dependencies present: mypy resolves imports
  # against the real environment, including Guard's PyO3 extension, so this job carries the Rust
  # toolchain and a full `uv sync` rather than `uv run --group dev` alone. Scope is `src/astro_mine`
  # — `tests` and `scripts` are linted but not yet type-checked.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Type-check (mypy)
        run: uv run mypy src/astro_mine

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each component runs under its source repo's CI selection.
          - { comp: core }
          - { comp: spice }
          - { comp: seal }
          - { comp: worlds }
          - { comp: prospect }
          - { comp: link }
          - { comp: fleet }
          - { comp: sim, marks: "not gpu and not ray and not docker" }
          - { comp: bench, marks: "not cluster and not gpu and not container" }
          - { comp: cloud }
          - { comp: surrogate }
          - { comp: mind, marks: "not pddl and not native and not slow and not sim" }
          - { comp: learn, marks: "not slow and not gpu and not cluster" }
          - { comp: allocate, marks: "not scale" }
          - { comp: guard, marks: "not sim and not slow" }
          - { comp: hub, marks: "not integration" }
          - { comp: studio }
          # Not a component: the platform-wide layering suite (conventions.md §11).
          - { comp: platform }
    name: test ${{ matrix.comp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Run ${{ matrix.comp }} suite
        run: >
          uv run python -m pytest tests/${{ matrix.comp }} -ra
          ${{ matrix.marks && format('-m "{0}"', matrix.marks) || '' }}
          --cov=astro_mine --cov-report=term

  # Hub's Postgres/pgvector catalog, against a real server. `astro-mine-hub` ran this as a
  # dedicated `integration` job with a pgvector service, and the consolidation dropped it: the
  # `hub` matrix entry above runs `-m "not integration"`, so `tests/hub/integration/` stopped
  # running anywhere and its tests reported as skips rather than failures. `SqlCatalog` is the
  # hosted Hub's search path, and its pgvector similarity behaviour is exactly what a unit test
  # against the in-memory backend cannot check — which is why the lane existed in the first place.
  #
  # The services come from `docker-compose.yml` rather than `services:` containers, deliberately:
  # that file is what the docs tell a developer to run, and a service block here would be a second
  # definition free to drift from it. It also lets `opa` mount the Rego bundle out of the checkout,
  # which a `services:` container cannot do — those start before the workspace exists.
  hub-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Start the services the suite needs
        # `--wait` for the two that can report their own health; the registry is distroless and has
        # no probe to run inside it, so it is polled from here over the endpoint the Distribution
        # Spec guarantees. Without the poll the suite races a registry that is still binding.
        run: |
          docker compose up -d --wait db opa
          docker compose up -d registry
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5000/v2/; then
              echo "registry ready"; exit 0
            fi
            sleep 2
          done
          echo "registry did not answer /v2/ within 120s"; docker compose logs registry; exit 1
      - name: Sync environment
        run: uv sync --group dev
      - name: Run the Hub integration suite
        env:
          HUB_POSTGRES_URL: postgresql+psycopg://hub:hub@localhost:5432/hub
          HUB_OCI_REGISTRY: localhost:5000
          HUB_OPA_URL: http://localhost:8181
        run: uv run python -m pytest tests/hub/integration -m integration -ra
      - name: Stop the services
        if: always()
        run: docker compose down -v

  # The opt-in lanes the source repos ran as dedicated jobs stay opt-in, because each needs an
  # environment this job does not have. Only `sim-e2e` was ever actually carried over, though:
  # `cluster` and `scale` were named here as if they had been, while their workflows stayed behind
  # in `astro-mine-cloud` and `astro-mine-allocate`. They now live beside this file as
  # `cluster-e2e.yml` (nightly + on a `cluster-e2e` label) and `scale-bench.yml` (weekly), rehomed
  # before those repositories were archived (RM-DIST-05) — so "trigger manually" now names
  # something that exists.
  #
  # `sim-e2e` was the one lane carried over, and it was carried over into a state where it could
  # not execute: the `if` below tests for a `workflow_dispatch` event that the `on:` block did not
  # declare, so the condition was never true and the job reported as a skip on every run. Skips
  # read as coverage. The trigger is declared now; the ten tests it selects are the real-Sim
  # integration suites in tests/mind and tests/guard.
  sim-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run python -m pytest tests/guard tests/mind -m sim -ra
