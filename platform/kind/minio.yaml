# MinIO -- the shared object store the cluster tests run against (cloud.md §5).
#
# This is what makes the equivalence gate possible at all: the host stages a job's inputs into it
# by content address, the pod reads them out, writes its outputs and its RunContext back, and the
# host reads *those*. One store, reached two ways -- by pods through cluster DNS, by the host
# through the node port kind maps to localhost:30900.
#
# A `hostPath` would have been simpler and wrong: the workload would then be reading a bind-mount,
# which is exactly what a cluster does not have, and the harness's object-store staging path --
# the thing under test -- would never run.
apiVersion: v1
kind: Namespace
metadata:
  name: astro-mine-system
---
apiVersion: v1
kind: Secret
metadata:
  name: minio
  namespace: astro-mine-system
type: Opaque
stringData:
  # Throwaway credentials for a throwaway cluster. Not a secret to protect; a secret to *have*,
  # because the harness authenticates to the store like it would anywhere else.
  root-user: minioadmin
  root-password: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: astro-mine-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: astro-mine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: astro-mine
    spec:
      # MinIO is the harness's object store, not a workload -- so it must sit where the chaos tests
      # cannot reach it. They kill a *worker* (`docker kill` on a kind node) to prove checkpoint
      # resume; MinIO's volume is an emptyDir, so a worker that dies takes the bucket with it. It
      # did: the run then failed seven later tests with NoSuchBucket, and the object store, not the
      # code, was what broke. Pin it to the control-plane, which the chaos tests never touch, and
      # tolerate the control-plane taint so it can actually land there.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-13T20-26-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio, key: root-user }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: minio, key: root-password }
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
# In-cluster: what a *pod* resolves (ASTRO_MINE_S3_ENDPOINT).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: astro-mine-system
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
---
# Out-of-cluster: what the *host* reaches through kind's extraPortMapping
# (ASTRO_MINE_S3_ENDPOINT_HOST -> http://localhost:30900).
apiVersion: v1
kind: Service
metadata:
  name: minio-nodeport
  namespace: astro-mine-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: s3, port: 9000, targetPort: 9000, nodePort: 30900 }
---
# Create the bucket. The artifact store deliberately does not do this -- bucket lifecycle is an
# operator concern, not the store's (see S3ArtifactStore's docstring).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: astro-mine-system
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-09-16T17-43-14Z
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio.astro-mine-system.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 2
              done
              mc mb --ignore-existing local/astro-mine
              mc ls local
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio, key: root-user }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: minio, key: root-password }
---
# The namespace the dispatch / equivalence / chaos tests submit into.
apiVersion: v1
kind: Namespace
metadata:
  name: astro-mine-runs
---
# The namespace the admission policy is scoped to. Scoping is not cosmetic: a
# cosign-verified-images-only ClusterPolicy matching `*` across every namespace would refuse the
# platform's own (unsigned, upstream) operator pods and take the cluster down with it.
apiVersion: v1
kind: Namespace
metadata:
  name: astro-mine-admission
