# kind profile + the supply-chain admission stack (cloud.md §9).
#
#   ADMISSION=1 ./platform/kind/up.sh
#
# The default kind profile turns admission off entirely, so the cosign-verified-images-only rule
# has never actually run anywhere. This profile installs Kyverno and points the policy at a key
# pair up.sh generates -- which is what lets tests/cluster/test_admission.py assert that a signed
# image is admitted and an unsigned one is *refused by the API server*.
#
# A standalone profile, not an overlay: `helm install -f kind-admission.yaml` is the whole
# command, and every operator makes an explicit enabled/disabled decision here.
kuberay-operator:
  enabled: true

argo-workflows:
  enabled: true
  server:
    enabled: false

kueue:
  enabled: true

gpu-operator:
  enabled: false

kube-prometheus-stack:
  enabled: false

loki:
  enabled: false

observability:
  enabled: false

kyverno:
  enabled: true
  features:
    registryClient:
      # The harness registry serves TLS with a self-signed CA that Kyverno trusts (see
      # admissionController.caCertificates below), so Kyverno verifies the registry's certificate
      # the way it would in production -- no insecure-registry escape hatch.
      #
      # This is `false` deliberately (astro-mine-cloud#30). `allowInsecure: true` does NOT let
      # Kyverno talk to a plain-HTTP registry: it only skips certificate *verification*, still over
      # HTTPS. Against the old plain-HTTP registry that meant a failed TLS handshake --
      #
      #   .attestors[0].entries[0].keys: Get "https://kind-registry:5000/v2/":
      #   http: server gave HTTP response to HTTPS client
      #
      # -- so it refused every image, signed or not, for a transport reason. The fix was to serve
      # the registry over TLS and distribute its CA, not to lean harder on this flag. (And do NOT
      # try `admissionController.container.extraArgs.allowInsecureRegistry`: that flag is already
      # rendered from this values path, the duplicate broke the admission controller, and its
      # webhook is failurePolicy=Fail -- so every pod creation in the cluster was denied, the API
      # server included. The webhook is a single point of failure, which is why it fails closed.)
      allowInsecure: false

  # Trust the harness registry's self-signed CA so Kyverno's signature *fetch* succeeds over HTTPS.
  # up.sh injects the CA generated by registry.sh here with
  #   --set-file kyverno.admissionController.caCertificates.data=<...>/ca.crt
  # The chart mounts it over /etc/ssl/certs/ca-certificates.crt -- the file Kyverno's Go registry
  # client reads -- so an empty default here (no CA, no mount) is exactly the pre-injection state.
  admissionController:
    caCertificates:
      data: ""

  # SEVEN of Kyverno 3.2.6's housekeeping jobs pull `bitnami/kubectl:1.28.5`, which Docker Hub no
  # longer serves -- Bitnami withdrew their public catalogue, and the tag now 404s. The pods sit in
  # ErrImagePull; `helm --wait` blocks on jobs that can never complete; the install dies ten minutes
  # later on "post-upgrade hooks failed: timed out waiting for the condition" -- on housekeeping,
  # not on anything it was installing.
  #
  # All seven are disabled here, not just the ones seen to fail: five report-cleanup CronJobs, the
  # post-upgrade policy-report cleanup hook, and the pre-delete webhook cleanup hook (which would
  # have bitten on teardown instead of install). They trim stale reports and webhooks on a long-lived
  # cluster; this one lives about fifteen minutes, so there is nothing to trim.
  cleanupJobs:
    admissionReports:
      enabled: false
    clusterAdmissionReports:
      enabled: false
    updateRequests:
      enabled: false
    ephemeralReports:
      enabled: false
    clusterEphemeralReports:
      enabled: false
  policyReportsCleanup:
    enabled: false
  webhooksCleanup:
    enabled: false

admission:
  enabled: true
  # up.sh generates the key pair and passes the public half with --set-file.
  cosignPublicKey: ""
  # SCOPED, deliberately, on two axes:
  #   - imageReferences: only the images the test signs. `*` would also cover the operator images
  #     the platform itself is made of, which are (correctly) not signed by our throwaway key.
  #   - namespaces: only the test's namespace. Between them, a rejected pod is a *test* result and
  #     not a dead cluster.
  imageReferences:
    - "kind-registry:5000/*"
  namespaces:
    - astro-mine-admission
  requireAttestations: true
  # The test signs with `--tlog-upload=false`: a local key pair, no Rekor, no network.
  ignoreTlog: true
