// Message catalog v0.1 — canonical Protobuf wire form for the control-plane
// messages (RM-P0-CORE-04): the action and contact-plan families.
//
// Per-tick hot-path messages (Observation/StateSample/SensorReading/CommsMask) are
// NOT here — they use Cap'n Proto (schema/observation.capnp) per conventions.md §3.
//
// Mirrors the canonical JSON Schema (messages.schema.json) and the Pydantic models
// (astro_mine.core.messages.model). Closed-vocabulary fields are carried as `string`
// (the SADF pattern): the type authority is the JSON Schema / Pydantic, and
// string<->string keeps the round-trip byte-exact and drift-free.
//
// Conventions: field tags are append-only and never reused (conventions.md §3).
// Nullable scalars use proto3 `optional` to preserve presence. Bindings are generated
// with grpcio-tools as a stopgap; buf replaces it in RM-P0-CORE-07.

syntax = "proto3";

package astro_mine.core.messages.v0;

import "astro_mine/core/units/_proto/units.proto";

// --- value types -----------------------------------------------------------------

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quat {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Transform {
  Vec3 translation_m = 1;
  Quat rotation_quat_xyzw = 2;
}

message Volume {
  string frame = 1;
  Vec3 center_m = 2;
  Vec3 dimensions_m = 3;
  optional astro_mine.core.units.v0.ReferenceFrame frame_ref = 4;  // typed sibling of `frame` (RFC-0007)
}

// --- action family ---------------------------------------------------------------

message ActuatorCommand {
  string target = 1;
  string control_mode = 2;  // ControlMode (closed vocab as string)
  repeated double setpoint = 3;
  optional string unit = 4;
  optional double stiffness = 5;
  optional double damping = 6;
  repeated double feedforward = 7;
  optional string trajectory_ref = 8;
}

message ModeCommand {
  string mode = 1;
  map<string, string> params = 2;
}

message GotoTask {
  string target_frame = 1;
  Transform target_pose = 2;
  optional double position_tolerance_m = 3;
  optional double heading_tolerance_rad = 4;
  optional double max_speed_mps = 5;
  optional astro_mine.core.units.v0.ReferenceFrame target_frame_ref = 6;  // typed sibling of `target_frame` (RFC-0007)
}

message SampleTask {
  string site_frame = 1;
  Vec3 target_point_m = 2;
  string method = 3;  // SampleMethod (closed vocab as string)
  optional double depth_m = 4;
  optional double sample_mass_kg = 5;
  optional astro_mine.core.units.v0.ReferenceFrame site_frame_ref = 6;  // typed sibling of `site_frame` (RFC-0007)
}

message ExcavateTask {
  Volume region = 1;
  string tool = 2;     // ExcavationTool (closed vocab as string)
  string pattern = 3;  // ExcavationPattern (closed vocab as string)
  optional double target_volume_m3 = 4;
}

message HaulTask {
  string from_frame = 1;
  string to_frame = 2;
  optional double payload_kg = 3;
  optional string resource_species = 4;
  optional astro_mine.core.units.v0.ReferenceFrame from_frame_ref = 5;  // typed sibling of `from_frame` (RFC-0007)
  optional astro_mine.core.units.v0.ReferenceFrame to_frame_ref = 6;    // typed sibling of `to_frame` (RFC-0007)
}

message DockTask {
  string target_asset_id = 1;
  optional string port_name = 2;
  optional string approach_frame = 3;
  optional astro_mine.core.units.v0.ReferenceFrame approach_frame_ref = 4;  // typed sibling of `approach_frame` (RFC-0007)
}

message HopTask {
  string launch_frame = 1;
  Vec3 target_point_m = 2;
  optional double range_m = 3;
  optional double apoapsis_m = 4;
  optional astro_mine.core.units.v0.ReferenceFrame launch_frame_ref = 5;  // typed sibling of `launch_frame` (RFC-0007)
}

message ChargeTask {
  string source = 1;  // ChargeSource (closed vocab as string)
  optional double target_soc_j = 2;
  optional double max_power_w = 3;
}

message ProspectTask {
  Volume region = 1;
  repeated string sensor_kinds = 2;
  optional double info_gain_target = 3;
}

message TaskDirective {
  string task_kind = 1;  // TaskKind (closed vocab as string)
  int32 priority = 2;
  optional double deadline_s = 3;
  optional GotoTask goto = 4;
  optional SampleTask sample = 5;
  optional ExcavateTask excavate = 6;
  optional HaulTask haul = 7;
  optional DockTask dock = 8;
  optional HopTask hop = 9;
  optional ChargeTask charge = 10;
  optional ProspectTask prospect = 11;
  optional string directive = 12;  // TaskKind.CUSTOM
  map<string, string> params = 13;  // TaskKind.CUSTOM
}

message Action {
  string agent_id = 1;
  string kind = 2;  // ActionKind (closed vocab as string)
  optional double sim_time_s = 3;
  optional ActuatorCommand actuator = 4;
  optional ModeCommand mode = 5;
  optional TaskDirective task = 6;
}

message ActionBatch {
  repeated Action actions = 1;
}

// --- contact-plan family ---------------------------------------------------------

message LinkBudget {
  optional double eirp_dbw = 1;
  optional double path_loss_db = 2;
  optional double gt_db_per_k = 3;
  optional double required_ebn0_db = 4;
  optional double margin_db = 5;
  optional string modcod = 6;
}

message ContactNode {
  string id = 1;
  string role = 2;  // NodeRole (closed vocab as string)
  optional string kind = 3;
}

message ContactInterval {
  string node_a = 1;
  string node_b = 2;
  double start_tdb_s = 3;
  double end_tdb_s = 4;
  optional double max_rate_bps = 5;
  optional double min_latency_s = 6;
  optional double mean_latency_s = 7;
  optional double margin_db = 8;
  string confidence = 9;  // ContactConfidence (closed vocab as string)
  optional string band = 10;
  optional string modcod = 11;
  optional LinkBudget link_budget = 12;
  optional astro_mine.core.units.v0.EpochWindow window = 13;  // typed sibling of start/end_tdb_s (RFC-0007)
}

message Route {
  string source = 1;
  string dest = 2;
  repeated string hops = 3;
  bool store_and_forward = 4;
  optional double earliest_delivery_tdb_s = 5;
  optional double total_latency_s = 6;
  optional astro_mine.core.units.v0.Epoch earliest_delivery = 7;  // typed sibling of earliest_delivery_tdb_s (RFC-0007)
}

message ContactPlan {
  repeated ContactNode nodes = 1;
  repeated ContactInterval intervals = 2;
  repeated Route routes = 3;
  optional double epoch_start_tdb_s = 4;
  optional double epoch_end_tdb_s = 5;
  optional astro_mine.core.units.v0.EpochWindow window = 6;  // typed sibling of epoch_start/end_tdb_s (RFC-0007)
}
